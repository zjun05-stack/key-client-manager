name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl pillow pystray pyinstaller

      - name: Build main EXE
        run: pyinstaller --onefile --windowed --name "客户管理" main.py

      - name: Build uninstaller EXE
        run: pyinstaller --onefile --windowed --name "卸载程序" uninstall.py

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: 业务员重点客户管理-完整包
          path: |
            dist/客户管理.exe
            dist/卸载程序.exe
            setup.bat
            重点客户名单.xlsx
